<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tezera wireframe history</title>
<meta name="description" content="Version history of the tezera lo-fi and hi-fi wireframes, by account type.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try { var t = localStorage.getItem('tz-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app">
  <header class="top">
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open version list" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#/"><span class="word">tezera</span> <span class="sub">wireframe history</span></a>
    <div class="top-actions">
      <span id="links"></span>
      <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <nav class="sidebar" id="sidebar" aria-label="Versions">
    <a class="nav-overview" href="#/">Overview</a>
    <div id="nav-roles"></div>
  </nav>
  <div class="scrim" id="scrim" hidden></div>

  <main id="main" tabindex="-1">
    <p class="state" id="state">Loading versions…</p>
  </main>
</div>
<script src="assets/app.js"></script>
</body>
</html>
