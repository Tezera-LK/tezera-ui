<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in or sign up · tezera vendor portal</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#050316}
.pg{min-height:100vh;background:#e9e7e2;color:#050316;font:400 14px/1.55 'Bricolage Grotesque',system-ui,sans-serif}
.shell{display:flex;flex-wrap:wrap;align-items:flex-start;gap:32px;padding:28px 32px 72px;max-width:1440px;margin:0 auto}
.side{flex:0 0 224px;max-width:100%}
.body{flex:999 1 600px;min-width:0;display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:20px}
.rail{flex:1 1 300px;max-width:360px;min-width:0;display:flex;flex-direction:column;gap:18px}
.full{flex:1 1 100%;min-width:0;display:flex;flex-direction:column;gap:20px}
.nv{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 14px;border-radius:10px;text-decoration:none;color:#163829;font:600 14px 'Bricolage Grotesque',system-ui,sans-serif;transition:background-color .15s ease}
.nv:not([aria-current="page"]):hover{background:#c5dccf}
.nv[aria-current="page"]{background:#fff;color:#245a43;font-weight:700}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.t{font:700 28px/1.15 'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.01em;margin:0}
.sub{margin:4px 0 0;color:#545b5e;font-size:15px}
.sec{font:700 16px/1.3 'Bricolage Grotesque',system-ui,sans-serif;margin:6px 0 -6px}
.panel{background:#c8d3db;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.panel>.hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:2px 2px 0}
.ph2{font:700 17px/1.3 'Bricolage Grotesque',system-ui,sans-serif;margin:0}
.card{background:#fff;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:#050316}
.row{background:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:14px;text-decoration:none;color:#050316}
a.row:hover,a.card:hover{background:#f6f7f5}
.list{background:#fff;border-radius:16px;padding:4px 16px}
.li{display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 0}
.li+.li{box-shadow:0 -1px 0 #e9e7e2}
.b{font-weight:700}
.m{color:#545b5e;font-size:13px}
.s{font-size:13px}
.lk{color:#3f566a;font-weight:700;font-size:13px;text-decoration:none}
.lk:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 20px;border-radius:999px;border:0;background:#70a992;color:#050316;font:600 14px 'Bricolage Grotesque',system-ui,sans-serif;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(.95)}
.btn.w{background:#fff}
.btn.sm{min-height:34px;padding:0 14px;font-size:13px}
.btn.wide{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;min-height:30px;padding:0 14px;border-radius:999px;border:0;background:#fff;color:#050316;font:600 13px 'Bricolage Grotesque',system-ui,sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none}
.chip.on{background:#70a992}
.chip.i{background:#c8d3db;color:#2f4556}
.panel .chip.i{background:#fff}
.tg{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:999px;background:#fff;font:600 12px 'Bricolage Grotesque',system-ui,sans-serif;white-space:nowrap;color:#050316}
.tg.ok{background:#cfe5da;color:#1f523c}
.tg.wait{background:#e3e8da;color:#3b4a2e}
.tg.org{background:#526c80;color:#fff}
.tg.dk{background:#050316;color:#fff}
.tg.p{background:#e9e7e2;color:#3b4a2e;font-style:italic;font-weight:500}
.ban{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-radius:16px;background:#dfe5d6}
.ban .dot{width:10px;height:10px;border-radius:50%;background:#3b4a2e;flex:0 0 auto}
.ban.ok{background:#cfe5da}
.ban.ok .dot{background:#1f523c}
.ph{background-color:#d6d8d3;background-image:linear-gradient(to top right,transparent calc(50% - 1px),#c3c6c0 calc(50% - 1px),#c3c6c0 calc(50% + 1px),transparent calc(50% + 1px)),linear-gradient(to bottom right,transparent calc(50% - 1px),#c3c6c0 calc(50% - 1px),#c3c6c0 calc(50% + 1px),transparent calc(50% + 1px));border-radius:12px;position:relative}
.ph>.tg{position:absolute;left:10px;top:10px}
.thumb{width:56px;height:56px;border-radius:12px;background:#c8d3db;flex:0 0 auto}
.av{width:40px;height:40px;border-radius:50%;background:#d3d6d0;flex:0 0 auto;position:relative;overflow:hidden}
.av::before{content:"";position:absolute;left:50%;top:22%;width:38%;height:38%;margin-left:-19%;border-radius:50%;background:#eceee9}
.av::after{content:"";position:absolute;left:50%;bottom:-18%;width:70%;height:46%;margin-left:-35%;border-radius:50%;background:#eceee9}
.av.org{background:#526c80}
.av.org::before,.av.org::after{background:#8ea3b3}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.ec{background:#c8d3db;border-radius:20px;padding:10px 10px 16px;display:flex;flex-direction:column;gap:6px}
.ec>.ecb{padding:6px 8px 0;display:flex;flex-direction:column;gap:6px}
.sp{display:flex;justify-content:space-between;align-items:center;gap:10px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
.in{min-height:44px;border:0;border-radius:12px;background:#fff;padding:0 14px;font:400 14px 'Bricolage Grotesque',system-ui,sans-serif;color:#050316;width:100%}
textarea.in{padding:12px 14px;min-height:96px;resize:vertical}
.panel .in{background:#fff}
.tabs{display:flex;gap:26px;flex-wrap:wrap;box-shadow:inset 0 -1px 0 #d0d3cc}
.tab{background:none;border:0;padding:10px 4px 12px;font:600 14px 'Bricolage Grotesque',system-ui,sans-serif;color:#545b5e;cursor:pointer}
.tab[aria-selected="true"]{color:#050316;box-shadow:inset 0 -3px 0 #70a992}
.ftabs{display:flex;gap:4px;flex-wrap:wrap}
.ft{min-height:46px;padding:0 22px;border:0;border-radius:16px 16px 0 0;font:600 14px 'Bricolage Grotesque',system-ui,sans-serif;color:#050316;cursor:pointer}
.fbody{background:#c8d3db;border-radius:0 20px 20px 20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.tog{width:44px;height:26px;border-radius:999px;border:0;position:relative;cursor:pointer;flex:0 0 auto}

.num{font:800 30px/1 'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:#e9e7e2;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:#70a992;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.test{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;background:#dfe5d6;color:#3b4a2e;font-weight:700;font-size:13px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:#545b5e;font-weight:600;padding:8px 10px}
td{padding:12px 10px;box-shadow:inset 0 1px 0 #e9e7e2}

<body>
<div id="app" data-page="Auth"></div>
<template id="tpl-Auth">
<div class="pg" style="display: flex; flex-wrap: wrap; gap: 24px; padding: 22px">
  <section aria-label="tezera" style="flex: 1 1 420px; max-width: 600px; min-height: 420px; background: #70a992; border-radius: 26px; padding: 48px 44px; display: flex; flex-direction: column; gap: 56px">
    <a href="Main.html" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: #050316">
      <span aria-hidden="true" style="position: relative; width: 34px; height: 22px; display: inline-block"><span style="position: absolute; left: 12px; top: 0; width: 22px; height: 22px; border-radius: 50%; background: #c5dccf"></span><span style="position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 50%; background: #e9e7e2"></span></span>
      <span style="font-weight: 700; font-size: 26px">tezera</span>
    </a>
    <div>
      <p style="margin: 0; font-weight: 700; font-size: 36px; line-height: 1.2; color: #fff; max-width: 13ch">Every event needs the right pieces.</p>
      <p style="margin: 16px 0 0; font-size: 16px; color: #fff; max-width: 40ch">Show your services, answer booking requests and job posts, and run your stalls in one place.</p>
    </div>
  </section>

  <main style="flex: 1 1 420px; display: flex; justify-content: center; padding: 56px 20px">
    <div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 16px">

      <template data-sc-if value="{{isSignup}}" hint-placeholder-val="{{true}}">
        <div><h1 class="t">Create your account</h1><p class="sub">One account, one role. To attend events too, use a second account.</p></div>
        <span class="b">I am joining as</span>
        <div role="radiogroup" aria-label="Role" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <template data-sc-for list="{{roles}}" as="r" hint-placeholder-count="4">
            <button role="radio" aria-checked="{{r.sel}}" onClick="{{r.pick}}" style="text-align: left; border: 0; border-radius: 14px; padding: 14px 16px; cursor: pointer; background: {{r.bg}}; font: 400 13px 'Bricolage Grotesque', system-ui, sans-serif; color: #050316">
              <span style="display: flex; justify-content: space-between; align-items: center"><span class="b" style="font-size: 15px">{{r.name}}</span><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: {{r.dot}}"></span></span>
              <span class="m" style="display: block; margin-top: 2px">{{r.note}}</span>
            </button>
          </template>
        </div>
        <button class="btn w wide">Continue with Google</button>
        <span class="m" style="text-align: center">or</span>
        <label class="fld">Email or phone<input class="in" placeholder="hello@kottulab.lk"></label>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
          <label class="fld">Password<input class="in" type="password" placeholder="••••••••••"></label>
          <label class="fld">Confirm password<input class="in" type="password" placeholder="••••••••••"></label>
        </div>
        <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px"><input type="checkbox" style="margin-top: 3px; width: 16px; height: 16px; accent-color: #70a992">I am under 18 and a parent or guardian agreed. <span class="tg p">16+ proposed</span></label>
        <button class="btn wide" onClick="{{toVerify}}">Create account</button>
        <span class="s">Already have an account? <button onClick="{{toLogin}}" class="lk" style="background: none; border: 0; cursor: pointer; font-size: 13px; padding: 0">Log in</button></span>
      </template>

      <template data-sc-if value="{{isVerify}}" hint-placeholder-val="{{false}}">
        <div><h1 class="t">Check your email</h1><p class="sub">We sent a 6-digit code to hello@kottulab.lk</p></div>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
          <input class="in" aria-label="Digit 1" value="4" style="text-align: center; font-size: 20px; font-weight: 700"><input class="in" aria-label="Digit 2" value="8" style="text-align: center; font-size: 20px; font-weight: 700"><input class="in" aria-label="Digit 3" value="2" style="text-align: center; font-size: 20px; font-weight: 700"><input class="in" aria-label="Digit 4" style="text-align: center"><input class="in" aria-label="Digit 5" style="text-align: center"><input class="in" aria-label="Digit 6" style="text-align: center">
        </div>
        <a class="btn wide" href="Profile.html">Verify and set up profile</a>
        <span class="s">Didn't get it? <span class="lk">Resend in 0:42</span></span>
      </template>

      <template data-sc-if value="{{isLogin}}" hint-placeholder-val="{{false}}">
        <div><h1 class="t">Welcome back</h1><p class="sub">Log in to your vendor account</p></div>
        <button class="btn w wide">Continue with Google</button>
        <span class="m" style="text-align: center">or</span>
        <label class="fld">Email or phone<input class="in" placeholder="hello@kottulab.lk"></label>
        <label class="fld">Password<input class="in" type="password" placeholder="••••••••••"></label>
        <a class="btn wide" href="Main.html">Log in</a>
        <span class="s">New to tezera? <button onClick="{{toSignup}}" class="lk" style="background: none; border: 0; cursor: pointer; font-size: 13px; padding: 0">Create an account</button></span>
        <div class="panel" style="margin-top: 16px">
          <span class="ph2">Forgot your password?</span>
          <span class="m">Enter your email or phone and we'll send a reset code.</span>
          <div style="display: flex; gap: 8px"><label style="flex: 1"><span class="sr">Email or phone</span><input class="in" placeholder="hello@kottulab.lk"></label><button class="btn" onClick="{{toVerify}}">Send code</button></div>
        </div>
      </template>

    </div>
  </main>
</div>
</template>
<script type="text/x-dc" id="js-Auth">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { v: 'signup', role: 'Vendor' }; }
  renderVals() {
    const { v, role } = this.state;
    const roles = [['Vendor', 'My business provides services'], ['Organiser', 'I run events'], ['Freelancer', 'I work events as an individual'], ['Attendee', 'I go to events']];
    return {
      isSignup: v === 'signup', isVerify: v === 'verify', isLogin: v === 'login',
      roles: roles.map(([name, note]) => ({ name, note, sel: String(name === role), bg: name === role ? '#c5dccf' : '#fff', dot: name === role ? '#70a992' : '#e9e7e2', pick: () => this.setState({ role: name }) })),
      toVerify: () => this.setState({ v: 'verify' }),
      toLogin: () => this.setState({ v: 'login' }),
      toSignup: () => this.setState({ v: 'signup' })
    };
  }
}
</script>

      <span style="position: absolute; top: 0; right: 0; width: 10px; height: 10px; border-radius: 50%; background: #050316"></span>

    };
  }

<script>
/* tezera wireframe runtime: renders the page templates in this file and wires up buttons. */
(function () {
  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(patch) {
      const p = typeof patch === 'function' ? patch(this.state, this.props) : patch;
      this.state = Object.assign({}, this.state, p);
      if (this.__inst) this.__inst.update();
    }
    forceUpdate() { if (this.__inst) this.__inst.update(); }
  }

  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;

  function lookup(path, scope) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    const parts = path.split('.');
    let v = scope[parts[0]];
    for (let i = 1; i < parts.length && v != null; i++) v = v[parts[i]];
    return v;
  }
  const interp = (s, scope) => s.replace(HOLE, (_, p) => { const v = lookup(p, scope); return v == null ? '' : String(v); });
  const camel = (s) => s.replace(/-([a-z])/g, (_, c) => c.toUpperCase());

  const defs = {};
  function def(name) {
    if (defs[name]) return defs[name];
    const tpl = document.getElementById('tpl-' + name);
    const js = document.getElementById('js-' + name);
    const Cls = new Function('DCLogic', js.textContent + '\nreturn Component;')(DCLogic);
    return (defs[name] = { tpl, Cls });
  }

  class Instance {
    constructor(name, props) {
      this.name = name;
      const d = def(name);
      this.tpl = d.tpl;
      this.logic = new d.Cls(props || {});
      this.logic.props = props || {};
      this.logic.__inst = this;
      this.children = {};
      if (this.logic.componentDidMount) setTimeout(() => this.logic.componentDidMount(), 0);
    }
    mount(host) { this.host = host; this.update(); }
    update() {
      if (!this.host) return;
      const scope = this.logic.renderVals ? (this.logic.renderVals() || {}) : {};
      this.importCount = 0;
      const frag = document.createDocumentFragment();
      this.renderInto(frag, this.tpl.content, scope);
      this.host.replaceChildren(frag);
    }
    renderInto(out, parent, scope) {
      for (const node of Array.from(parent.childNodes)) {
        if (node.nodeType === 3) {
          out.appendChild(document.createTextNode(node.data.indexOf('{{') >= 0 ? interp(node.data, scope) : node.data));
        } else if (node.nodeType === 1) {
          this.renderEl(out, node, scope);
        }
      }
    }
    renderEl(out, node, scope) {
      if (node.tagName === 'TEMPLATE') {
        if (node.hasAttribute('data-sc-for')) {
          const m = (node.getAttribute('list') || '').match(WHOLE);
          const list = m ? lookup(m[1], scope) : [];
          const as = node.getAttribute('as') || 'item';
          (list || []).forEach((item, i) => {
            const s = Object.create(scope); s[as] = item; s.$index = i;
            this.renderInto(out, node.content, s);
          });
          return;
        }
        if (node.hasAttribute('data-sc-if')) {
          const m = (node.getAttribute('value') || '').match(WHOLE);
          if (m && lookup(m[1], scope)) this.renderInto(out, node.content, scope);
          return;
        }
        if (node.hasAttribute('data-dc-import')) {
          const name = node.getAttribute('name');
          const props = {};
          for (const a of Array.from(node.attributes)) {
            if (a.name === 'name' || a.name === 'data-dc-import' || a.name.indexOf('hint-') === 0) continue;
            const m = a.value.match(WHOLE);
            props[camel(a.name)] = m ? lookup(m[1], scope) : interp(a.value, scope);
          }
          const key = (this.importCount++) + ':' + name;
          let child = this.children[key];
          if (!child) child = this.children[key] = new Instance(name, props);
          child.logic.props = props;
          const host = document.createElement('div');
          host.style.display = 'contents';
          out.appendChild(host);
          child.mount(host);
          return;
        }
      }
      const el = document.importNode(node, false);
      for (const a of Array.from(node.attributes)) {
        if (a.value.indexOf('{{') < 0) continue;
        const m = a.value.match(WHOLE);
        if (m) {
          const v = lookup(m[1], scope);
          if (/^on/.test(a.name) && typeof v === 'function') {
            el.removeAttribute(a.name);
            el.addEventListener(a.name.slice(2).toLowerCase(), v);
          } else if (v === false || v == null) {
            el.removeAttribute(a.name);
          } else {
            el.setAttribute(a.name, v === true ? '' : String(v));
          }
        } else {
          el.setAttribute(a.name, interp(a.value, scope));
        }
      }
      this.renderInto(el, node.tagName === 'TEMPLATE' ? node.content : node, scope);
      out.appendChild(el);
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    const app = document.getElementById('app');
    new Instance(app.getAttribute('data-page')).mount(app);
  });
})();

</script>
</body>
