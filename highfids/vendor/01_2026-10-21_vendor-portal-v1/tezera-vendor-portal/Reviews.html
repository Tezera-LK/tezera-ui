<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews and rank · tezera vendor portal</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#050316}a:hover{color:#050316}
.h{font-family:'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.02em;margin:0;line-height:1.1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;box-sizing:border-box;border-radius:14px 14px 3px 14px;border:1.5px solid #70a992;background:#70a992;color:#050316;font:600 15px 'Instrument Sans',system-ui,sans-serif;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(.94)}
.btn.o{background:transparent;border-color:#050316}
.tab{min-height:48px;padding:0 22px;border:0;border-radius:18px 18px 0 0;font:600 15px 'Instrument Sans',system-ui,sans-serif;color:#050316;cursor:pointer}
.box{background:#e9e7e2;border-radius:18px 18px 4px 18px;padding:20px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.tag{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:999px;background:#b6c3a7;color:#050316;font:600 12px 'Instrument Sans',system-ui,sans-serif;white-space:nowrap}
.org{background:#526c80;color:#fff}
.pri{background:transparent;border:1px dashed #050316;font-weight:500}
.muted{color:rgba(5,3,22,.72)}
.num{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:4px;background:#b6c3a7;overflow:hidden;flex:1}
.meter i{display:block;height:100%;background:#050316}
.in{min-height:46px;border:1.5px solid #658095;border-radius:12px 12px 3px 12px;background:#fff;padding:0 14px;font:400 15px 'Instrument Sans',system-ui,sans-serif;color:#050316;box-sizing:border-box;width:100%}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.rate{width:40px;height:38px;border-radius:12px 12px 3px 12px;border:1.5px solid #050316;font:700 14px 'Instrument Sans',system-ui,sans-serif;cursor:pointer;color:#050316}
td,th{padding:12px 8px;text-align:left;border-bottom:1px solid #b6c3a7}
th{font-size:13px;border-bottom:1.5px solid #658095}
</style>
</head>
<body>
<div id="app" data-page="Reviews"></div>
<template id="tpl-Reviews">
<div style="min-height: 100vh; background: #e9e7e2; font-family: 'Instrument Sans', system-ui, sans-serif; color: #050316; font-size: 15px; line-height: 1.5">
  <template data-dc-import name="Topbar" hint-size="100%,84px"></template>
  <div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 28px; padding: 24px 28px 56px; max-width: 1440px; margin: 0 auto; box-sizing: border-box">
    <div style="flex: 0 1 250px; min-width: 220px">
      <template data-dc-import name="Sidebar" active="reviews" hint-size="100%,960px"></template>
    </div>
    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
      <div>
        <h1 class="h" style="font-size: 40px; font-weight: 800">Reviews and rank</h1>
        <p class="muted" style="margin: 6px 0 0">Your rank score orders organisers' search results. Tiers: New, Rising, Top Rated.</p>
      </div>
      <div>
        <div role="tablist" aria-label="Reviews" style="display: flex; gap: 4px; flex-wrap: wrap">
          <template data-sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
            <button class="tab" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="background: {{t.bg}}">{{t.label}}</button>
          </template>
        </div>
        <div style="background: #658095; border-radius: 0 24px 6px 24px; padding: 14px; display: flex; flex-direction: column; gap: 14px">

          <template data-sc-if value="{{isRecv}}" hint-placeholder-val="{{true}}">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px">
              <div class="box" style="justify-content: center">
                <span class="num" style="font-size: 64px">4.6</span>
                <span style="font-weight: 600">Average from 18 reviews</span>
                <div style="display: flex; gap: 6px; flex-wrap: wrap"><span class="tag" style="background: #70a992">Rising</span><span class="tag">Rank 7, Colombo F&amp;B</span></div>
              </div>
              <div class="box">
                <strong>From organisers (12)</strong>
                <template data-sc-for list="{{orgCats}}" as="c" hint-placeholder-count="4">
                  <div style="display: flex; align-items: center; gap: 10px; font-size: 14px"><span style="width: 130px">{{c.k}}</span><span class="meter"><i style="width: {{c.w}}"></i></span><strong style="width: 28px">{{c.v}}</strong></div>
                </template>
              </div>
              <div class="box">
                <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap"><strong>From attendees at my stalls (6)</strong><span class="tag pri">Proposed</span></div>
                <template data-sc-for list="{{conCats}}" as="c" hint-placeholder-count="3">
                  <div style="display: flex; align-items: center; gap: 10px; font-size: 14px"><span style="width: 130px">{{c.k}}</span><span class="meter"><i style="width: {{c.w}}"></i></span><strong style="width: 28px">{{c.v}}</strong></div>
                </template>
              </div>
            </div>
            <div class="box" style="flex-direction: row; flex-wrap: wrap; gap: 8px; align-items: center">
              <span style="font-weight: 600; font-size: 14px">Filter</span>
              <span class="tag" style="background: #70a992">All</span><span class="tag">Organisers</span><span class="tag">Attendees</span><span class="tag">Catering</span><span class="tag">Stalls</span><span class="tag pri">Service and event type: Could</span>
            </div>
            <template data-sc-for list="{{reviews}}" as="r" hint-placeholder-count="3">
              <article class="box">
                <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px">
                  <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center"><span class="tag" style="background: {{r.whoBg}}; color: {{r.whoFg}}">{{r.who}}</span><span class="tag">{{r.service}}</span><span class="muted" style="font-size: 14px">{{r.date}}</span></div>
                  <span class="num" style="font-size: 24px">{{r.score}}</span>
                </div>
                <p style="margin: 0">{{r.text}}</p>
                <template data-sc-if value="{{r.hasReply}}" hint-placeholder-val="{{false}}">
                  <div style="margin-left: 16px; padding: 12px 14px; border-radius: 14px 14px 3px 14px; background: rgba(112,169,146,.35)"><strong style="display: block; font-size: 13px">Your reply</strong>{{r.reply}}</div>
                </template>
                <template data-sc-if value="{{r.replying}}" hint-placeholder-val="{{false}}">
                  <label class="fld">Your public reply (one per review)<textarea class="in" style="padding: 12px 14px; min-height: 70px"></textarea></label>
                  <div style="display: flex; gap: 8px"><button class="btn" onClick="{{r.post}}">Post reply</button><button class="btn o" onClick="{{r.closeReply}}">Cancel</button></div>
                </template>
                <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center">
                  <template data-sc-if value="{{r.canReply}}" hint-placeholder-val="{{true}}"><button class="btn o" onClick="{{r.openReply}}" style="min-height: 38px">Reply</button><span class="tag pri">Could</span></template>
                  <template data-sc-if value="{{r.notReported}}" hint-placeholder-val="{{true}}"><button class="btn o" onClick="{{r.report}}" style="min-height: 38px">Report review</button></template>
                  <template data-sc-if value="{{r.reported}}" hint-placeholder-val="{{false}}"><span style="font-weight: 600; font-size: 14px">Reported. An admin hides it if it breaks the rules.</span></template>
                </div>
              </article>
            </template>
          </template>

          <template data-sc-if value="{{isGive}}" hint-placeholder-val="{{false}}">
            <div class="box">
              <template data-sc-if value="{{notGiven}}" hint-placeholder-val="{{true}}">
                <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between">
                  <div><span class="tag org">Coastline Collective</span><h2 class="h" style="font-size: 24px; font-weight: 800; margin-top: 6px">Office party, 18 Oct</h2></div>
                  <span class="tag">Window closes 1 Nov</span>
                </div>
                <p class="muted" style="margin: 0; font-size: 14px">Reviews open when a booking completes or a stall's event ends, and close 14 days later (proposed).</p>
                <template data-sc-for list="{{giveCats}}" as="g" hint-placeholder-count="3">
                  <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
                    <strong style="width: 140px">{{g.k}}</strong>
                    <div role="radiogroup" aria-label="{{g.k}}" style="display: flex; gap: 6px">
                      <template data-sc-for list="{{g.opts}}" as="o" hint-placeholder-count="5">
                        <button class="rate" role="radio" aria-checked="{{o.sel}}" onClick="{{o.pick}}" style="background: {{o.bg}}">{{o.n}}</button>
                      </template>
                    </div>
                  </div>
                </template>
                <label class="fld">What should other providers know?<textarea class="in" style="padding: 12px 14px; min-height: 90px"></textarea></label>
                <button class="btn" onClick="{{submit}}" style="align-self: flex-start">Post review</button>
              </template>
              <template data-sc-if value="{{given}}" hint-placeholder-val="{{false}}">
                <h2 class="h" style="font-size: 26px; font-weight: 800">Review posted.</h2>
                <p style="margin: 0">It shows on Coastline Collective's profile for other providers.</p>
              </template>
            </div>
          </template>

          <template data-sc-if value="{{isBoard}}" hint-placeholder-val="{{false}}">
            <div class="box">
              <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; justify-content: space-between">
                <h2 class="h" style="font-size: 22px; font-weight: 700">Top providers</h2>
                <div style="display: flex; gap: 10px; flex-wrap: wrap">
                  <label class="fld">Category<select class="in" style="min-width: 180px"><option>F&amp;B stall</option><option>Media agency</option><option>Sound and lighting</option><option>Décor</option></select></label>
                  <label class="fld">District<select class="in" style="min-width: 160px"><option>Colombo</option><option>Gampaha</option><option>Kandy</option><option>Galle</option></select></label>
                </div>
              </div>
              <div style="overflow-x: auto">
                <table style="width: 100%; border-collapse: collapse; min-width: 520px">
                  <thead><tr><th>Rank</th><th>Provider</th><th>Tier</th><th>Rating</th><th>Reviews</th></tr></thead>
                  <tbody>
                    <template data-sc-for list="{{board}}" as="b" hint-placeholder-count="6">
                      <tr style="background: {{b.bg}}"><td><strong>{{b.rank}}</strong></td><td><strong>{{b.name}}</strong></td><td><span class="tag">{{b.tier}}</span></td><td>{{b.rating}}</td><td>{{b.count}}</td></tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </template>

        </div>
      </div>
    </main>
  </div>
</div>
</template>
<script type="text/x-dc" id="js-Reviews">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'recv', replying: -1, replied: { 1: 'Thank you! See you at the next fair.' }, reported: {}, scores: {}, given: false }; }
  renderVals() {
    const { tab, replying, replied, reported, scores, given } = this.state;
    const cat = (k, v) => ({ k, v: v.toFixed(1), w: (v / 5 * 100) + '%' });
    const data = [
      { who: 'Harbour Lights Events', org: true, service: 'Catering · Food fair', date: '2 Oct', score: '5.0', text: 'Fast service even at the evening rush. Clean stall and great with the crowd.' },
      { who: 'Attendee', org: false, service: 'Stall · Night market', date: '28 Sep', score: '4.5', text: 'Best cheese kottu at the market. The queue moved quickly.' },
      { who: 'Lotus Weddings', org: true, service: 'Catering · Wedding', date: '30 Sep', score: '4.0', text: 'Food was lovely. Arrived 20 minutes later than the run-of-show.' }
    ];
    const defs = [['recv', 'Reviews I receive'], ['give', 'Review an organiser (1)'], ['board', 'Leaderboard']];
    const names = ['Payment', 'Communication', 'Planning'];
    return {
      tabs: defs.map(([k, label]) => ({ label, sel: String(k === tab), bg: k === tab ? '#658095' : '#b6c3a7', pick: () => this.setState({ tab: k }) })),
      isRecv: tab === 'recv', isGive: tab === 'give', isBoard: tab === 'board',
      orgCats: [cat('Quality', 4.8), cat('Punctuality', 4.3), cat('Communication', 4.7), cat('Value for money', 4.5)],
      conCats: [cat('Quality', 4.7), cat('Value for money', 4.4), cat('Service', 4.6)],
      reviews: data.map((r, k) => ({ ...r,
        whoBg: r.org ? '#526c80' : '#b6c3a7', whoFg: r.org ? '#fff' : '#050316',
        hasReply: !!replied[k], reply: replied[k] || '',
        replying: replying === k, canReply: !replied[k] && replying !== k,
        reported: !!reported[k], notReported: !reported[k],
        openReply: () => this.setState({ replying: k }),
        closeReply: () => this.setState({ replying: -1 }),
        post: () => this.setState({ replying: -1, replied: { ...replied, [k]: 'Thank you for having us. We have added more staff for evening service.' } }),
        report: () => this.setState({ reported: { ...reported, [k]: true } })
      })),
      giveCats: names.map((k) => ({ k, opts: [1, 2, 3, 4, 5].map((n) => ({ n, sel: String(scores[k] === n), bg: (scores[k] || 0) >= n ? '#70a992' : 'transparent', pick: () => this.setState({ scores: { ...scores, [k]: n } }) })) })),
      notGiven: !given, given,
      submit: () => this.setState({ given: true }),
      board: [
        { rank: '1', name: 'Hela Bites', tier: 'Top Rated', rating: '4.9', count: '64' },
        { rank: '2', name: 'Sweet Spot Desserts', tier: 'Top Rated', rating: '4.8', count: '51' },
        { rank: '3', name: 'Colombo Grill Co.', tier: 'Top Rated', rating: '4.8', count: '47' },
        { rank: '6', name: 'Lime and Leaf', tier: 'Rising', rating: '4.6', count: '22' },
        { rank: '7', name: 'Kottu Lab (you)', tier: 'Rising', rating: '4.6', count: '18' },
        { rank: '8', name: 'Pol Roti House', tier: 'Rising', rating: '4.5', count: '15' }
      ].map((b) => ({ ...b, bg: b.rank === '7' ? 'rgba(112,169,146,.35)' : 'transparent' }))
    };
  }
}
</script>
<template id="tpl-Topbar">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; padding: 16px 28px; background: #e9e7e2; border-bottom: 1.5px solid #b6c3a7; font-family: 'Instrument Sans', system-ui, sans-serif; color: #050316; box-sizing: border-box; width: 100%">
  <a href="Main.html" style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em; text-decoration: none; color: #050316; flex: 0 0 auto; padding: 4px 0">tezera</a>
  <label style="flex: 1 1 280px; max-width: 540px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; background: rgba(255,255,255,0.75); border-radius: 999px; box-sizing: border-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#050316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="6"></circle><path d="M15 15l5 5"></path></svg>
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</span>
    <input type="search" placeholder="Search events, organisers, job posts" style="flex: 1; min-width: 0; border: 0; background: transparent; font: 400 15px 'Instrument Sans', system-ui, sans-serif; color: #050316; outline-offset: 4px">
  </label>
  <div style="display: flex; align-items: center; gap: 10px; flex: 0 0 auto">
    <a href="Messages.html" aria-label="Messages, 2 unread" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.75); display: grid; place-items: center; position: relative">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#050316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H10l-5 4v-4H4z"></path></svg>
      <span style="position: absolute; top: 6px; right: 6px; width: 10px; height: 10px; border-radius: 50%; background: #050316; border: 2px solid #e9e7e2"></span>
    </a>
    <a href="Notifications.html" aria-label="Notifications, 3 new" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.75); display: grid; place-items: center; position: relative">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#050316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 21h4"></path></svg>
      <span style="position: absolute; top: 6px; right: 6px; width: 10px; height: 10px; border-radius: 50%; background: #050316; border: 2px solid #e9e7e2"></span>
    </a>
    <a href="Profile.html" style="min-height: 36px; padding: 0 18px; display: inline-flex; align-items: center; border-radius: 999px; background: #70a992; color: #050316; font-weight: 600; font-size: 14px; text-decoration: none">Vendor</a>
  </div>
</header>
</template>
<script type="text/x-dc" id="js-Topbar">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
<template id="tpl-Sidebar">
<nav aria-label="Vendor menu" style="width: 100%; box-sizing: border-box; background: #70a992; border-radius: 28px 28px 6px 28px; padding: 26px 16px 20px; display: flex; flex-direction: column; gap: 20px; font-family: 'Instrument Sans', system-ui, sans-serif; color: #050316">
  <template data-sc-for list="{{groups}}" as="group" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 0 4px; text-align: center; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -0.01em">{{group.title}}</h2>
      <template data-sc-for list="{{group.items}}" as="item" hint-placeholder-count="5">
        <a href="{{item.href}}" aria-current="{{item.current}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 12px 12px 3px 12px; text-decoration: none; color: #050316; font-size: 15px; background: {{item.bg}}; font-weight: {{item.weight}}">
          <span aria-hidden="true" style="width: 12px; height: 11px; border-radius: 4px 4px 1px 4px; flex: 0 0 auto; background: {{item.tile}}"></span>
          <span style="flex: 1">{{item.label}}</span>
          <template data-sc-if value="{{item.hasCount}}" hint-placeholder-val="{{false}}">
            <span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #050316; color: #e9e7e2; font-size: 12px; font-weight: 700; display: grid; place-items: center">{{item.count}}</span>
          </template>
        </a>
      </template>
    </div>
  </template>
  <a href="Verification.html" style="display: block; margin-top: 4px; padding: 14px; border-radius: 16px 16px 4px 16px; background: #e9e7e2; color: #050316; text-decoration: none; font-size: 13px; line-height: 1.4">
    <span style="display: block; font-weight: 700; font-size: 14px">Verification pending</span>
    You need the Verified badge to accept bookings. Check status
  </a>
</nav>
</template>
<script type="text/x-dc" id="js-Sidebar">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const mk = (key, label, href, count) => {
      const on = key === active;
      return {
        key, label, href,
        current: on ? 'page' : 'false',
        bg: on ? '#e9e7e2' : '#b6c3a7',
        weight: on ? '700' : '500',
        tile: on ? '#050316' : '#658095',
        hasCount: !!count, count: count || ''
      };
    };
    return {
      groups: [
        { title: 'General', items: [
          mk('dashboard', 'Dashboard', 'Main.html'),
          mk('feed', 'Feed and events', 'Feed.html'),
          mk('community', 'Community', 'Community.html'),
          mk('messages', 'Messages', 'Messages.html', 2),
          mk('notifications', 'Notifications', 'Notifications.html', 3)
        ]},
        { title: 'Vendor tools', items: [
          mk('requests', 'Booking requests', 'Requests.html', 2),
          mk('jobs', 'Job posts', 'Jobs.html'),
          mk('stalls', 'Stalls', 'Stalls.html', 1),
          mk('bookings', 'My bookings', 'Bookings.html'),
          mk('mystall', 'My stall listing', 'MyStall.html'),
          mk('payments', 'Payments', 'Payments.html')
        ]},
        { title: 'Account', items: [
          mk('profile', 'My profile', 'Profile.html'),
          mk('reviews', 'Reviews and rank', 'Reviews.html'),
          mk('verification', 'Verification', 'Verification.html'),
          mk('settings', 'Settings', 'Settings.html')
        ]}
      ]
    };
  }
}
</script>
<script>
/* tezera wireframe runtime: renders the page templates in this file and wires up buttons. */
(function () {
  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(patch) {
      const p = typeof patch === 'function' ? patch(this.state, this.props) : patch;
      this.state = Object.assign({}, this.state, p);
      if (this.__inst) this.__inst.update();
    }
    forceUpdate() { if (this.__inst) this.__inst.update(); }
  }

  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;

  function lookup(path, scope) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    const parts = path.split('.');
    let v = scope[parts[0]];
    for (let i = 1; i < parts.length && v != null; i++) v = v[parts[i]];
    return v;
  }
  const interp = (s, scope) => s.replace(HOLE, (_, p) => { const v = lookup(p, scope); return v == null ? '' : String(v); });
  const camel = (s) => s.replace(/-([a-z])/g, (_, c) => c.toUpperCase());

  const defs = {};
  function def(name) {
    if (defs[name]) return defs[name];
    const tpl = document.getElementById('tpl-' + name);
    const js = document.getElementById('js-' + name);
    const Cls = new Function('DCLogic', js.textContent + '\nreturn Component;')(DCLogic);
    return (defs[name] = { tpl, Cls });
  }

  class Instance {
    constructor(name, props) {
      this.name = name;
      const d = def(name);
      this.tpl = d.tpl;
      this.logic = new d.Cls(props || {});
      this.logic.props = props || {};
      this.logic.__inst = this;
      this.children = {};
      if (this.logic.componentDidMount) setTimeout(() => this.logic.componentDidMount(), 0);
    }
    mount(host) { this.host = host; this.update(); }
    update() {
      if (!this.host) return;
      const scope = this.logic.renderVals ? (this.logic.renderVals() || {}) : {};
      this.importCount = 0;
      const frag = document.createDocumentFragment();
      this.renderInto(frag, this.tpl.content, scope);
      this.host.replaceChildren(frag);
    }
    renderInto(out, parent, scope) {
      for (const node of Array.from(parent.childNodes)) {
        if (node.nodeType === 3) {
          out.appendChild(document.createTextNode(node.data.indexOf('{{') >= 0 ? interp(node.data, scope) : node.data));
        } else if (node.nodeType === 1) {
          this.renderEl(out, node, scope);
        }
      }
    }
    renderEl(out, node, scope) {
      if (node.tagName === 'TEMPLATE') {
        if (node.hasAttribute('data-sc-for')) {
          const m = (node.getAttribute('list') || '').match(WHOLE);
          const list = m ? lookup(m[1], scope) : [];
          const as = node.getAttribute('as') || 'item';
          (list || []).forEach((item, i) => {
            const s = Object.create(scope); s[as] = item; s.$index = i;
            this.renderInto(out, node.content, s);
          });
          return;
        }
        if (node.hasAttribute('data-sc-if')) {
          const m = (node.getAttribute('value') || '').match(WHOLE);
          if (m && lookup(m[1], scope)) this.renderInto(out, node.content, scope);
          return;
        }
        if (node.hasAttribute('data-dc-import')) {
          const name = node.getAttribute('name');
          const props = {};
          for (const a of Array.from(node.attributes)) {
            if (a.name === 'name' || a.name === 'data-dc-import' || a.name.indexOf('hint-') === 0) continue;
            const m = a.value.match(WHOLE);
            props[camel(a.name)] = m ? lookup(m[1], scope) : interp(a.value, scope);
          }
          const key = (this.importCount++) + ':' + name;
          let child = this.children[key];
          if (!child) child = this.children[key] = new Instance(name, props);
          child.logic.props = props;
          const host = document.createElement('div');
          host.style.display = 'contents';
          out.appendChild(host);
          child.mount(host);
          return;
        }
      }
      const el = document.importNode(node, false);
      for (const a of Array.from(node.attributes)) {
        if (a.value.indexOf('{{') < 0) continue;
        const m = a.value.match(WHOLE);
        if (m) {
          const v = lookup(m[1], scope);
          if (/^on/.test(a.name) && typeof v === 'function') {
            el.removeAttribute(a.name);
            el.addEventListener(a.name.slice(2).toLowerCase(), v);
          } else if (v === false || v == null) {
            el.removeAttribute(a.name);
          } else {
            el.setAttribute(a.name, v === true ? '' : String(v));
          }
        } else {
          el.setAttribute(a.name, interp(a.value, scope));
        }
      }
      this.renderInto(el, node.tagName === 'TEMPLATE' ? node.content : node, scope);
      out.appendChild(el);
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    const app = document.getElementById('app');
    new Instance(app.getAttribute('data-page')).mount(app);
  });
})();

</script>
</body>
